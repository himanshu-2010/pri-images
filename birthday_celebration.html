<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Soumya! 🎉🎂</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-dark: #120919;
      --bg-card: rgba(30, 20, 42, 0.7);
      --gold-primary: #FFD700;
      --gold-accent: #F4D06F;
      --pink-accent: #FF5A87;
      --purple-accent: #8E24AA;
      --text-light: #F7F5FB;
      --text-muted: #D1C4E9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top center, #2e163b 0%, #120919 70%, #08030c 100%);
      color: var(--text-light);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Particles Canvas */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 80px 20px;
      position: relative;
      z-index: 2;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInDown 1.2s ease-out;
    }

    h1.main-title {
      font-family: 'Cinzel', serif;
      font-size: 3.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFF 0%, #FFE082 40%, #FFB300 70%, #FFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .name-title {
      font-family: 'Great Vibes', cursive;
      font-size: 4.5rem;
      color: #FF80AB;
      text-shadow: 0 0 20px rgba(255, 128, 171, 0.6);
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--text-muted);
      font-style: italic;
      max-width: 700px;
      margin: 0 auto 30px auto;
      line-height: 1.6;
    }

    /* Action Buttons */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .btn {
      background: linear-gradient(135deg, var(--gold-primary), #FF8F00);
      color: #120919;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 30px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 35px rgba(255, 215, 0, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-light);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: var(--gold-primary);
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
    }

    /* Poster Section */
    .poster-section {
      background: var(--bg-card);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      margin-bottom: 60px;
      text-align: center;
    }

    .poster-section h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold-accent);
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .poster-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
    }

    .poster-img {
      width: 100%;
      max-width: 900px;
      height: auto;
      display: block;
      border-radius: 16px;
      transition: transform 0.5s ease;
    }

    .poster-img:hover {
      transform: scale(1.02);
    }

    /* Grid Section */
    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      color: var(--gold-accent);
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 80px;
      height: 3px;
      background: var(--gold-primary);
      margin: 15px auto 0 auto;
      border-radius: 2px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 60px;
    }

    .gallery-card {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.4s ease;
      cursor: pointer;
      position: relative;
    }

    .gallery-card:hover {
      transform: translateY(-8px);
      border-color: var(--gold-primary);
      box-shadow: 0 15px 30px rgba(255, 215, 0, 0.3);
    }

    .card-img-wrapper {
      width: 100%;
      height: 320px;
      overflow: hidden;
      position: relative;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .gallery-card:hover .card-img {
      transform: scale(1.1);
    }

    .card-caption {
      padding: 15px 20px;
      text-align: center;
    }

    .card-tag {
      font-size: 0.8rem;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;

      font-weight: 600;
    }

    .card-title {
      font-size: 1rem;
      color: var(--text-light);
      font-weight: 600;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
    }

    .lightbox-close {
      position: absolute;
      top: 25px;
      right: 35px;
      font-size: 2.5rem;
      color: #fff;
      cursor: pointer;
      transition: color 0.3s;
    }

    .lightbox-close:hover {
      color: var(--gold-primary);
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 215, 0, 0.2);
    }

    /* Keyframe Animations */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <div class="container">
    <header>
      <h1 class="main-title">HAPPY BIRTHDAY</h1>
      <div class="name-title">Soumya</div>
      <p class="subtitle">“May your day be filled with endless joy, laughter, warmth, and memories to cherish forever!” ✨🎂</p>

      <div class="controls">
        <button class="btn" onclick="triggerConfetti()">🎉 Launch Birthday Fireworks!</button>
        <a class="btn btn-secondary" href="happy_birthday_collage.png" download="happy_birthday_collage.png">📥 Download High-Res Poster</a>
      </div>
    </header>

    <!-- Master Poster Collage Section -->
    <div class="poster-section">
      <h2>✨ Special Birthday Collage Poster ✨</h2>
      <div class="poster-wrapper">
        <img class="poster-img" src="happy_birthday_collage.jpg" alt="Happy Birthday Soumya Collage Poster" onclick="openLightbox(this.src)">
      </div>
    </div>

    <!-- Gallery Grid Section -->
    <h2 class="section-title">Memories Gallery</h2>
    <div class="gallery-grid" id="galleryGrid">
      <!-- Dynamically Populated by JS -->
    </div>

    <footer>
      <p>Made with ❤️ for Soumya's Birthday Celebration • 2026</p>
    </footer>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightboxImg">
  </div>

  <script>
    // Sample gallery photos metadata
    const photos = [
      { src: 'for-collage/real_pair_girl_and_boy_selfie.jpg', tag: 'Pair Selfie', title: 'Special Memory' },
      { src: 'for-collage/real_hands_bracelets.jpg', tag: 'Matching Bracelets', title: 'Shared Bond' },
      { src: 'for-collage/real_girl_portrait_01.webp', tag: 'Traditional Wear', title: 'Pink Bandhani Dress' },
      { src: 'for-collage/real_group_auditorium_01.jpg', tag: 'Friends Group', title: 'Auditorium Celebration' },
      { src: 'for-collage/real_girl_umbrella_selfie.jpg', tag: 'Cute Selfie', title: 'Under the Umbrella' },
      { src: 'for-collage/real_girl_portrait_03.webp', tag: 'Ethnic Portrait', title: 'Bright Pink Gown' },
      { src: 'for-collage/real_girl_portrait_08.webp', tag: 'Saree Elegance', title: 'Purple Saree Drapes' },
      { src: 'for-collage/real_group_auditorium_02.jpg', tag: 'Group Moments', title: 'Fun Times' },
      { src: 'for-collage/real_group_auditorium_03.jpg', tag: 'Group Memory', title: 'Group Photo' },
      { src: 'for-collage/real_girl_portrait_05.webp', tag: 'Nature Portrait', title: 'Outdoor Pose' },
      { src: 'for-collage/real_boy_portrait_himanshu.png', tag: 'Himanshu', title: 'Formal Portrait' },
      { src: 'for-collage/real_girl_portrait_10.webp', tag: 'Saree Grace', title: 'Graceful Pose' }
    ];

    // Render Gallery
    const grid = document.getElementById('galleryGrid');
    photos.forEach(p => {
      const card = document.createElement('div');
      card.className = 'gallery-card';
      card.onclick = () => openLightbox(p.src);
      card.innerHTML = `
        <div class="card-img-wrapper">
          <img class="card-img" src="${p.src}" alt="${p.title}">
        </div>
        <div class="card-caption">
          <div class="card-tag">${p.tag}</div>
          <div class="card-title">${p.title}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    // Lightbox Controls
    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    // Confetti FX
    function triggerConfetti() {
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    // Auto confetti on load
    window.addEventListener('load', () => {
      setTimeout(triggerConfetti, 600);
    });

    // Particle Background Effect
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height + canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 1.5 + 0.5;
        this.speedX = Math.random() * 0.6 - 0.3;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.color = Math.random() > 0.4 ? '255, 215, 0' : '255, 128, 171';
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 50; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
